# Операции на боевом сервере footballacademymorev.ru через SSH из GitHub Actions.
#
# Запуск:
#   • вручную: Actions → «Server ops» → Run workflow (выбрать mode);
#   • пушем файла .deploy/request.json в рабочую ветку: {"mode": "inspect" | "snapshot" | "deploy"}.
#
# Режимы:
#   inspect  — только чтение: где лежит сайт, git-состояние, pm2, nginx, ответы сайта.
#   snapshot — копия кода с сервера (без .env/секретов/node_modules/uploads) в ветку server-snapshot-*,
#              чтобы не потерять правки, сделанные прямо на сервере.
#   deploy   — бэкап текущей папки → выкладка ветки → сборка, миграции, перезапуск PM2 → проверка сайта.
#   admin    — создать/обновить пользователя ADMIN из секретов ADMIN_EMAIL / ADMIN_PASSWORD.
#
# Нужные секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY  — приватный ключ (ed25519), публичная часть в ~/.ssh/authorized_keys на сервере. Обязателен.
#   DEPLOY_HOST     — по умолчанию 31.192.111.33 (новый сервер footballacademymorev.ru)
#   DEPLOY_USER     — по умолчанию root
#   DEPLOY_PATH     — необязателен: папка сайта определяется автоматически (pm2 cwd / поиск клона с apps/web)
name: Server ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | snapshot | deploy | admin"
        type: choice
        options: [inspect, snapshot, deploy, admin]
        default: inspect
      branch:
        description: "Ветка для deploy"
        default: claude/sleepy-brown-rst71s
  push:
    branches: [claude/sleepy-brown-rst71s]
    paths: [".deploy/request.json"]

permissions:
  contents: write

concurrency:
  group: server-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOST: ${{ secrets.DEPLOY_HOST || '31.192.111.33' }}
      SSH_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      REPO_PATH: ${{ secrets.DEPLOY_PATH }}
      HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          BRANCH="${{ github.event.inputs.branch }}"
          if [ -z "$MODE" ] && [ -f .deploy/request.json ]; then
            MODE=$(jq -r '.mode // "inspect"' .deploy/request.json)
            BRANCH=$(jq -r '.branch // empty' .deploy/request.json)
          fi
          MODE="${MODE:-inspect}"
          BRANCH="${BRANCH:-${GITHUB_REF_NAME}}"
          case "$MODE" in inspect|snapshot|deploy|admin) ;; *) echo "Unknown mode $MODE"; exit 1;; esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "mode=$MODE branch=$BRANCH host=$HOST path=$REPO_PATH"

      - name: Check secret
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::Нет секрета DEPLOY_SSH_KEY. Добавьте приватный ключ в Settings → Secrets and variables → Actions."
          exit 1

      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Нормализуем ключ: CRLF, пробелы по краям строк, ключ, вставленный одной строкой.
          python3 - <<'PY'
          import os, re
          k = os.environ.get("KEY", "").replace("\r", "").strip()
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", k, re.S)
          compact = re.sub(r"\s+", "", k)
          if m:
              kind, body = m.group(1), re.sub(r"\s+", "", m.group(2))
          elif compact.startswith("b3BlbnNzaC1rZXktdjE"):  # base64("openssh-key-v1") — тело без строк BEGIN/END
              kind, body = "OPENSSH PRIVATE KEY", re.sub(r"[^A-Za-z0-9+/=]", "", compact)
          else:
              start = ("публичный ключ ssh-…" if k.startswith("ssh-") else
                       "пусто" if not k else "неизвестный формат (не выводим содержимое)")
              print(f"::error::DEPLOY_SSH_KEY не похож на приватный ключ: длина {len(k)}, строк {k.count(chr(10)) + 1}, {start}")
              raise SystemExit(1)
          lines = [body[i:i + 70] for i in range(0, len(body), 70)]
          out = f"-----BEGIN {kind}-----\n" + "\n".join(lines) + f"\n-----END {kind}-----\n"
          path = os.path.expanduser("~/.ssh/id_deploy")
          open(path, "w").write(out); os.chmod(path, 0o600)
          print(f"key: type={kind!r} body_chars={len(body)}")
          PY
          ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/pub 2>/tmp/kerr && echo "key ok: $(cut -d' ' -f1,3 /tmp/pub)" || { echo "::error::Ключ не читается: $(cat /tmp/kerr)"; exit 1; }
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName $HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            ServerAliveInterval 30
          EOF
          ssh prod 'echo "connected: $(hostname) $(hostname -I 2>/dev/null)"'

      - name: Detect site folder
        run: |
          # PM2 на сервере запущен не от root (например, от admin) — команды pm2/сборки выполняем от его имени.
          PM2_USER=$(ssh prod "ps -eo user=,args= | grep -E 'PM2 v[0-9]' | grep -v grep | awk '{print \$1}' | head -1")
          PM2_USER="${PM2_USER:-root}"
          echo "PM2_USER=$PM2_USER" >> "$GITHUB_ENV"
          echo "pm2 user: $PM2_USER"
          if [ -z "$REPO_PATH" ]; then
            REPO_PATH=$(ssh prod "PM2_USER='$PM2_USER' bash -s" <<'EOS'
          pm2u() { if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u "$PM2_USER" -H pm2 "$@"; fi; }
          # 1) рабочая папка процесса Next/API в PM2 → корень git-клона
          for name in fam-web fam-api; do
            cwd=$(pm2u jlist 2>/dev/null | jq -r --arg n "$name" '.[] | select(.name==$n) | .pm2_env.pm_cwd' | head -1)
            if [ -n "$cwd" ] && root=$(git -c safe.directory='*' -C "$cwd" rev-parse --show-toplevel 2>/dev/null); then echo "$root"; exit 0; fi
          done
          # 2) любой git-клон с apps/web
          for g in $(find /var/www /srv /opt /root /home -maxdepth 5 -type d -name .git 2>/dev/null); do
            d=$(dirname "$g"); [ -d "$d/apps/web" ] && { echo "$d"; exit 0; }
          done
          EOS
            )
          fi
          if [ -z "$REPO_PATH" ]; then
            echo "::warning::Папка сайта не найдена автоматически — см. вывод Inspect (можно задать секрет DEPLOY_PATH)"
            [ "$MODE" = "inspect" ] || { echo "::error::Без папки сайта режим $MODE невозможен"; exit 1; }
          fi
          echo "REPO_PATH=$REPO_PATH" >> "$GITHUB_ENV"
          echo "site folder: ${REPO_PATH:-<not found>}"

      - name: Inspect (read-only)
        run: |
          ssh prod "REPO_PATH='$REPO_PATH' PM2_USER='$PM2_USER' bash -s" <<'EOS'
          set +e
          pm2u() { if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u "$PM2_USER" -H pm2 "$@"; fi; }
          echo "== host"; hostname; hostname -I; uptime
          echo "== /var/www"; ls -la /var/www 2>/dev/null
          echo "== git clones"
          for d in /var/www/*/repo /var/www/* /srv/* /opt/* /root/* /home/*/* /home/*/*/*; do
            [ -d "$d/.git" ] || continue
            echo "---- $d"
            (cd "$d" && echo "owner: $(stat -c %U .)" && git -c safe.directory='*' remote -v | head -2 && echo "branch: $(git -c safe.directory='*' branch --show-current)" && git -c safe.directory='*' log --oneline -5 && echo "status:" && git -c safe.directory='*' status --short | head -60)
          done
          echo "== configured REPO_PATH: $REPO_PATH"; ls -la "$REPO_PATH" 2>/dev/null | head -5
          echo "== pm2 (user $PM2_USER)"; pm2u list 2>/dev/null || true
          pm2u jlist 2>/dev/null | jq -r '.[] | "\(.name)\tcwd=\(.pm2_env.pm_cwd)\tstatus=\(.pm2_env.status)"' 2>/dev/null || true
          echo "== nginx"; nginx -T 2>/dev/null | grep -E "server_name|root |proxy_pass|listen" | sort -u | head -40
          echo "== local site"; curl -s -o /dev/null -w "next:%{http_code}\n" http://127.0.0.1:3000/ ; curl -s -o /dev/null -w "api:%{http_code}\n" http://127.0.0.1:4200/health
          echo "== disk"; df -h / | tail -1
          EOS

      - name: Snapshot server code → branch
        if: env.MODE == 'snapshot'
        run: |
          SHA=$(ssh prod "cd '$REPO_PATH' && git -c safe.directory='*' rev-parse HEAD")
          echo "server HEAD: $SHA"
          SNAP="server-snapshot-$(date -u +%Y%m%d-%H%M)"
          git fetch origin "$SHA" 2>/dev/null || true
          if git cat-file -e "$SHA^{commit}" 2>/dev/null; then git checkout -b "$SNAP" "$SHA"; else git checkout -b "$SNAP" origin/main; fi
          mkdir -p /tmp/srv
          # Без секретов и тяжёлых артефактов: .env*, credentials, ключи, node_modules, сборки, загрузки.
          ssh prod "cd '$REPO_PATH' && tar czf - \
            --exclude=.git --exclude=node_modules --exclude=.next --exclude=dist --exclude=.turbo \
            --exclude=uploads --exclude='*.env' --exclude='.env*' --exclude='credentials*' \
            --exclude='*.pem' --exclude='*.key' --exclude='*.log' --exclude='*.mp4' --exclude='*.webm' ." \
            | tar xzf - -C /tmp/srv
          rsync -a --delete --exclude=.git --exclude=node_modules --exclude=uploads \
            --exclude='*.mp4' --exclude='*.webm' /tmp/srv/ ./
          git config user.name "server-ops"; git config user.email "server-ops@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Сервер совпадает с коммитом $SHA — локальных правок нет."; exit 0; fi
          git diff --cached --stat | tail -40
          git commit -q -m "snapshot: код с сервера ($HOST, HEAD $SHA)"
          git push origin "$SNAP"
          echo "::notice::Снимок сервера: ветка $SNAP"

      - name: Deploy
        if: env.MODE == 'deploy'
        run: |
          ssh prod "REPO_PATH='$REPO_PATH' BRANCH='$BRANCH' PM2_USER='$PM2_USER' bash -s" <<'EOS'
          set -euo pipefail
          cd "$REPO_PATH"
          OWNER=$(stat -c %U "$REPO_PATH")
          echo "==> repo owner: $OWNER, pm2 user: $PM2_USER"
          asowner() { if [ "$OWNER" = root ]; then bash -c "$1"; else sudo -u "$OWNER" -H bash -c "$1"; fi; }
          mkdir -p /var/backups/fam-deploy
          TS=$(date -u +%Y%m%d-%H%M%S)
          echo "==> backup code → /var/backups/fam-deploy/repo-$TS.tgz"
          tar czf "/var/backups/fam-deploy/repo-$TS.tgz" --exclude=node_modules --exclude=.next --exclude=uploads -C "$REPO_PATH" . || true
          if command -v pg_dump >/dev/null && [ -f apps/api/.env ]; then
            DBURL=$(grep -E '^DATABASE_URL=' apps/api/.env | head -1 | cut -d= -f2- | tr -d '"' | sed 's/?schema=.*//')
            pg_dump "$DBURL" -Fc -f "/var/backups/fam-deploy/db-$TS.dump" && echo "==> db backup ok" || echo "WARN: db backup failed"
          fi
          # Код, сборка и PM2 — от владельца папки (тот же пользователь, что держит PM2), без дублей процессов под root.
          asowner "cd '$REPO_PATH' && git fetch origin '$BRANCH' && git checkout -B '$BRANCH' 'origin/$BRANCH' \
            && GIT_BRANCH='$BRANCH' GIT_RESET_HARD=1 PM2_RESTART='fam-api fam-web' bash deploy/server-git-deploy.sh"
          EOS

      - name: Ensure admin user
        if: env.MODE == 'admin'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then echo "::error::Нужны секреты ADMIN_EMAIL и ADMIN_PASSWORD"; exit 1; fi
          # Пароль передаётся через stdin, не через аргументы командной строки.
          printf '%s\n%s\n' "$ADMIN_EMAIL" "$ADMIN_PASSWORD" | ssh prod "REPO_PATH='$REPO_PATH' bash -c '
            set -e; read -r E; read -r P; cd \"\$REPO_PATH/apps/api\"; set -a; . ./.env; set +a;
            O=\$(stat -c %U .); export ADMIN_EMAIL=\"\$E\" ADMIN_PASSWORD=\"\$P\" ADMIN_NAME=\"Администратор\";
            if [ \"\$O\" = root ]; then node scripts/ensure-admin-user.cjs; else sudo -E -u \"\$O\" node scripts/ensure-admin-user.cjs; fi'"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://footballacademymorev.ru/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")
          echo "login check: HTTP $code"; [ "$code" = "200" ] || [ "$code" = "201" ]

      - name: Verify site
        if: env.MODE == 'deploy'
        run: |
          sleep 10
          for u in / /llms.txt /shkola-vratarej /robots.txt /sitemap.xml /api/site; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://footballacademymorev.ru$u")
            echo "$code $u"
          done
          curl -s https://footballacademymorev.ru/api/site | jq '{phone, vkLink, yandexMapUrl}'
