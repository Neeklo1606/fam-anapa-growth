# Операции на боевом сервере footballacademymorev.ru через SSH из GitHub Actions.
#
# Запуск:
#   • вручную: Actions → «Server ops» → Run workflow (выбрать mode);
#   • пушем файла .deploy/request.json в рабочую ветку: {"mode": "inspect" | "snapshot" | "deploy"}.
#
# Режимы:
#   inspect  — только чтение: где лежит сайт, git-состояние, pm2, nginx, ответы сайта.
#   snapshot — копия кода с сервера (без .env/секретов/node_modules/uploads) в ветку server-snapshot-*,
#              чтобы не потерять правки, сделанные прямо на сервере.
#   deploy   — бэкап текущей папки → выкладка ветки → сборка, миграции, перезапуск PM2 → проверка сайта.
#   admin    — создать/обновить пользователя ADMIN из секретов ADMIN_EMAIL / ADMIN_PASSWORD.
#   bootstrap — admin + токен бота MAX из секрета MAX_BOT_TOKEN + подписка webhook + диагностика.
#   media    — забрать файлы из /root/fam-incoming на сервере, сжать видео (MP4/WebM/мобильное/постер)
#              и фото (WebP) и запушить в ветку media-incoming для разметки и встраивания.
#   maxdiag  — диагностика уведомлений из БД по SSH (только флаги и счётчики, без персональных данных).
#   maxcheck — вход в админку, диагностика MAX (только счётчики), тест-сообщение и тестовая заявка через сайт.
#
# Нужные секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY  — приватный ключ (ed25519), публичная часть в ~/.ssh/authorized_keys на сервере. Обязателен.
#   DEPLOY_HOST     — по умолчанию 31.192.111.33 (новый сервер footballacademymorev.ru)
#   DEPLOY_USER     — по умолчанию root
#   DEPLOY_PATH     — необязателен: папка сайта определяется автоматически (pm2 cwd / поиск клона с apps/web)
name: Server ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | snapshot | deploy | admin"
        type: choice
        options: [inspect, snapshot, deploy, admin, maxcheck, maxdiag, bootstrap, media]
        default: inspect
      branch:
        description: "Ветка для deploy"
        default: claude/sleepy-brown-rst71s
  push:
    branches: [claude/sleepy-brown-rst71s]
    paths: [".deploy/request.json"]

permissions:
  contents: write

concurrency:
  group: server-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOST: ${{ secrets.DEPLOY_HOST || '31.192.111.33' }}
      SSH_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      REPO_PATH: ${{ secrets.DEPLOY_PATH }}
      HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          BRANCH="${{ github.event.inputs.branch }}"
          if [ -z "$MODE" ] && [ -f .deploy/request.json ]; then
            MODE=$(jq -r '.mode // "inspect"' .deploy/request.json)
            BRANCH=$(jq -r '.branch // empty' .deploy/request.json)
          fi
          MODE="${MODE:-inspect}"
          BRANCH="${BRANCH:-${GITHUB_REF_NAME}}"
          case "$MODE" in inspect|snapshot|deploy|admin|maxcheck|maxdiag|bootstrap|media) ;; *) echo "Unknown mode $MODE"; exit 1;; esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "mode=$MODE branch=$BRANCH host=$HOST path=$REPO_PATH"

      - name: Check secret
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::Нет секрета DEPLOY_SSH_KEY. Добавьте приватный ключ в Settings → Secrets and variables → Actions."
          exit 1

      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Нормализуем ключ: CRLF, пробелы по краям строк, ключ, вставленный одной строкой.
          python3 - <<'PY'
          import os, re
          k = os.environ.get("KEY", "").replace("\r", "").strip()
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", k, re.S)
          compact = re.sub(r"\s+", "", k)
          if m:
              kind, body = m.group(1), re.sub(r"\s+", "", m.group(2))
          elif compact.startswith("b3BlbnNzaC1rZXktdjE"):  # base64("openssh-key-v1") — тело без строк BEGIN/END
              kind, body = "OPENSSH PRIVATE KEY", re.sub(r"[^A-Za-z0-9+/=]", "", compact)
          else:
              start = ("публичный ключ ssh-…" if k.startswith("ssh-") else
                       "пусто" if not k else "неизвестный формат (не выводим содержимое)")
              print(f"::error::DEPLOY_SSH_KEY не похож на приватный ключ: длина {len(k)}, строк {k.count(chr(10)) + 1}, {start}")
              raise SystemExit(1)
          lines = [body[i:i + 70] for i in range(0, len(body), 70)]
          out = f"-----BEGIN {kind}-----\n" + "\n".join(lines) + f"\n-----END {kind}-----\n"
          path = os.path.expanduser("~/.ssh/id_deploy")
          open(path, "w").write(out); os.chmod(path, 0o600)
          print(f"key: type={kind!r} body_chars={len(body)}")
          PY
          ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/pub 2>/tmp/kerr && echo "key ok: $(cat /tmp/pub)" || { echo "::error::Ключ не читается: $(cat /tmp/kerr)"; exit 1; }
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName $HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            ServerAliveInterval 20
            ServerAliveCountMax 30
            TCPKeepAlive yes
          EOF
          ssh prod 'echo "connected: $(hostname) $(hostname -I 2>/dev/null)"'

      - name: Detect site folder
        run: |
          # PM2 на сервере запущен не от root (например, от admin) — команды pm2/сборки выполняем от его имени.
          PM2_USER=$(ssh prod "ps -eo user=,args= | grep -E 'PM2 v[0-9]' | grep -v grep | awk '{print \$1}' | head -1")
          PM2_USER="${PM2_USER:-root}"
          echo "PM2_USER=$PM2_USER" >> "$GITHUB_ENV"
          echo "pm2 user: $PM2_USER"
          if [ -z "$REPO_PATH" ]; then
            REPO_PATH=$(ssh prod "PM2_USER='$PM2_USER' bash -s" <<'EOS'
          pm2u() { if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u "$PM2_USER" -H pm2 "$@"; fi; }
          # 1) рабочая папка процесса Next/API в PM2 → корень git-клона
          for name in fam-web fam-api; do
            cwd=$(pm2u jlist 2>/dev/null | jq -r --arg n "$name" '.[] | select(.name==$n) | .pm2_env.pm_cwd' | head -1)
            if [ -n "$cwd" ] && root=$(git -c safe.directory='*' -C "$cwd" rev-parse --show-toplevel 2>/dev/null); then echo "$root"; exit 0; fi
          done
          # 2) любой git-клон с apps/web
          for g in $(find /var/www /srv /opt /root /home -maxdepth 5 -type d -name .git 2>/dev/null); do
            d=$(dirname "$g"); [ -d "$d/apps/web" ] && { echo "$d"; exit 0; }
          done
          EOS
            )
          fi
          if [ -z "$REPO_PATH" ]; then
            echo "::warning::Папка сайта не найдена автоматически — см. вывод Inspect (можно задать секрет DEPLOY_PATH)"
            [ "$MODE" = "inspect" ] || { echo "::error::Без папки сайта режим $MODE невозможен"; exit 1; }
          fi
          echo "REPO_PATH=$REPO_PATH" >> "$GITHUB_ENV"
          echo "site folder: ${REPO_PATH:-<not found>}"

      - name: Inspect (read-only)
        run: |
          ssh prod "REPO_PATH='$REPO_PATH' PM2_USER='$PM2_USER' bash -s" <<'EOS'
          set +e
          pm2u() { if [ "$PM2_USER" = root ]; then pm2 "$@"; else sudo -u "$PM2_USER" -H pm2 "$@"; fi; }
          # Логи публичного репозитория видны всем — выводим только то, что касается сайта академии.
          echo "== uptime"; uptime
          d="$REPO_PATH"
          if [ -d "$d/.git" ]; then
            echo "---- $d (owner: $(stat -c %U "$d"))"
            (cd "$d" && echo "branch: $(git -c safe.directory='*' branch --show-current)" && git -c safe.directory='*' log --oneline -3 && echo "status:" && git -c safe.directory='*' status --short | head -40)
          fi
          echo "== configured REPO_PATH: $REPO_PATH"; ls -la "$REPO_PATH" 2>/dev/null | head -5
          echo "== pm2 (user $PM2_USER)"
          pm2u jlist 2>/dev/null | jq -r '.[] | select(.name|startswith("fam-")) | "\(.name)\tstatus=\(.pm2_env.status)\trestarts=\(.pm2_env.restart_time)\tuptime_ms=\(now*1000 - .pm2_env.pm_uptime | floor)"' 2>/dev/null || true
          echo "== fam upstreams"; grep -rhA3 "upstream fam_" /etc/nginx/ 2>/dev/null | grep -E "upstream|server " | sort -u
          WEB_PORT=$(grep -rhA3 "upstream fam_next_upstream" /etc/nginx/ 2>/dev/null | grep -oE "127\.0\.0\.1:[0-9]+" | head -1 | cut -d: -f2)
          echo "fam web port: ${WEB_PORT:-?}"
          for u in / /llms.txt /shkola-vratarej /robots.txt; do
            curl -s -o /dev/null -w "local ${u} → %{http_code}\n" "http://127.0.0.1:${WEB_PORT:-3000}$u"
          done
          curl -s -o /dev/null -w "api:%{http_code}\n" http://127.0.0.1:4200/health
          curl -s http://127.0.0.1:4200/api/site | jq -c '{phone, vkLink, maxLink, yandexMapUrl, homeContentVersion: (.homeContent.version // null)}' 
          echo "== disk"; df -h / | tail -1
          EOS

      - name: Snapshot server code → branch
        if: env.MODE == 'snapshot'
        run: |
          SHA=$(ssh prod "cd '$REPO_PATH' && git -c safe.directory='*' rev-parse HEAD")
          echo "server HEAD: $SHA"
          SNAP="server-snapshot-$(date -u +%Y%m%d-%H%M)"
          git fetch origin "$SHA" 2>/dev/null || true
          if git cat-file -e "$SHA^{commit}" 2>/dev/null; then git checkout -b "$SNAP" "$SHA"; else git checkout -b "$SNAP" origin/main; fi
          mkdir -p /tmp/srv
          # Без секретов и тяжёлых артефактов: .env*, credentials, ключи, node_modules, сборки, загрузки.
          ssh prod "cd '$REPO_PATH' && tar czf - \
            --exclude=.git --exclude=node_modules --exclude=.next --exclude=dist --exclude=.turbo \
            --exclude=uploads --exclude='*.env' --exclude='.env*' --exclude='credentials*' \
            --exclude='*.pem' --exclude='*.key' --exclude='*.log' --exclude='*.mp4' --exclude='*.webm' ." \
            | tar xzf - -C /tmp/srv
          rsync -a --delete --exclude=.git --exclude=node_modules --exclude=uploads \
            --exclude='*.mp4' --exclude='*.webm' /tmp/srv/ ./
          git config user.name "server-ops"; git config user.email "server-ops@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Сервер совпадает с коммитом $SHA — локальных правок нет."; exit 0; fi
          git diff --cached --stat | tail -40
          git commit -q -m "snapshot: код с сервера ($HOST, HEAD $SHA)"
          git push origin "$SNAP"
          echo "::notice::Снимок сервера: ветка $SNAP"

      - name: Deploy
        if: env.MODE == 'deploy'
        run: |
          ssh prod "REPO_PATH='$REPO_PATH' BRANCH='$BRANCH' PM2_USER='$PM2_USER' bash -s" <<'EOS'
          set -euo pipefail
          cd "$REPO_PATH"
          OWNER=$(stat -c %U "$REPO_PATH")
          echo "==> repo owner: $OWNER, pm2 user: $PM2_USER"
          asowner() { if [ "$OWNER" = root ]; then bash -c "$1"; else sudo -u "$OWNER" -H bash -c "$1"; fi; }
          mkdir -p /var/backups/fam-deploy
          TS=$(date -u +%Y%m%d-%H%M%S)
          echo "==> backup code → /var/backups/fam-deploy/repo-$TS.tgz"
          tar czf "/var/backups/fam-deploy/repo-$TS.tgz" --exclude=node_modules --exclude=.next --exclude=uploads -C "$REPO_PATH" . || true
          if command -v pg_dump >/dev/null && [ -f apps/api/.env ]; then
            DBURL=$(grep -E '^DATABASE_URL=' apps/api/.env | head -1 | cut -d= -f2- | tr -d '"' | sed 's/?schema=.*//')
            pg_dump "$DBURL" -Fc -f "/var/backups/fam-deploy/db-$TS.dump" && echo "==> db backup ok" || echo "WARN: db backup failed"
          fi
          # CI=true: pnpm не ждёт подтверждения в TTY при пересоздании node_modules.
          # Код, сборка и PM2 — от владельца папки (тот же пользователь, что держит PM2), без дублей процессов под root.
          WEB_PORT=$(grep -rhA3 "upstream fam_next_upstream" /etc/nginx/ 2>/dev/null | grep -oE "127\.0\.0\.1:[0-9]+" | head -1 | cut -d: -f2)
          echo "==> fam web port: ${WEB_PORT:-3000}"
          asowner "cd '$REPO_PATH' && git fetch origin '$BRANCH' && git checkout -B '$BRANCH' 'origin/$BRANCH' \
            && WEB_PORT=${WEB_PORT:-3000} CI=true GIT_BRANCH='$BRANCH' GIT_RESET_HARD=1 PM2_RESTART='fam-api fam-web' bash deploy/server-git-deploy.sh"
          EOS

      - name: Ensure admin user
        if: env.MODE == 'admin' || env.MODE == 'bootstrap'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then echo "::error::Нужны секреты ADMIN_EMAIL и ADMIN_PASSWORD"; exit 1; fi
          # Пароль передаётся через stdin, не через аргументы командной строки.
          printf '%s\n%s\n' "$ADMIN_EMAIL" "$ADMIN_PASSWORD" | ssh prod "REPO_PATH='$REPO_PATH' bash -c '
            set -e; read -r E; read -r P; cd \"\$REPO_PATH/apps/api\"; set -a; . ./.env; set +a;
            O=\$(stat -c %U .); export ADMIN_EMAIL=\"\$E\" ADMIN_PASSWORD=\"\$P\" ADMIN_NAME=\"Администратор\";
            if [ \"\$O\" = root ]; then node scripts/ensure-admin-user.cjs; else sudo -E -u \"\$O\" node scripts/ensure-admin-user.cjs; fi'"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://footballacademymorev.ru/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")
          echo "login check: HTTP $code"; [ "$code" = "200" ] || [ "$code" = "201" ]

      - name: Configure MAX bot (token from secret)
        if: env.MODE == 'bootstrap'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: |
          [ -n "$MAX_BOT_TOKEN" ] || { echo "::error::Нет секрета MAX_BOT_TOKEN"; exit 1; }
          echo "::add-mask::$MAX_BOT_TOKEN"
          B=https://footballacademymorev.ru/api; J=/tmp/jar
          code=$(curl -s -c $J -b $J -o /dev/null -w "%{http_code}" -X POST "$B/auth/login" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")
          echo "admin login: HTTP $code"; [ "$code" = "200" ] || exit 1
          CSRF=$(awk '$6=="fam_csrf"{print $7}' $J | tail -1)
          curl -s -b $J -c $J -X PATCH "$B/notifications/max" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" \
            -d "$(jq -n --arg t "$MAX_BOT_TOKEN" '{botAccessToken:$t, publicAppUrl:"https://footballacademymorev.ru"}')" \
            | jq -c '{hasBotToken: .integration.hasBotToken, webhookUrl: .integration.webhookUrl, lastWebhookError: .integration.lastWebhookError, message}'
          curl -s -b $J -c $J -X POST "$B/notifications/max/webhook/sync" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{}' \
            | jq -c '{bot: (.diagnostics.bot.name // null), webhookActive: .diagnostics.webhookActive, foreign: (.diagnostics.foreignWebhooks|length),
                     approved: (.subscribersApproved|length), pending: (.subscribersPending|length), warnings: .diagnostics.warnings}'

      - name: MAX check (login → diagnostics → test message → test lead)
        if: env.MODE == 'maxcheck'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          B=https://footballacademymorev.ru/api
          J=/tmp/jar
          LOGGED=0
          if [ -n "$ADMIN_EMAIL" ] && [ -n "$ADMIN_PASSWORD" ]; then
            code=$(curl -s -c $J -b $J -o /tmp/login.json -w "%{http_code}" -X POST "$B/auth/login" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')")
            echo "admin login: HTTP $code"; [ "$code" = "200" ] && LOGGED=1
          else
            echo "::warning::Секретов ADMIN_EMAIL/ADMIN_PASSWORD нет — только тестовая заявка, без диагностики"
          fi
          CSRF=$(awk '$6=="fam_csrf"{print $7}' $J | tail -1)
          diag() { curl -s -b $J "$B/notifications/max" | jq -c '{
            botOk: (.diagnostics.bot != null), tokenError: .diagnostics.tokenError,
            webhookActive: .diagnostics.webhookActive, foreignWebhooks: (.diagnostics.foreignWebhooks|length),
            approved: (.subscribersApproved|length), pending: (.subscribersPending|length),
            lastSendAt: .diagnostics.lastSendAt, lastSendOk: .diagnostics.lastSendOk, lastSendError: .diagnostics.lastSendError,
            warnings: .diagnostics.warnings }'; }
          if [ "$LOGGED" = 1 ]; then
            echo "== MAX diagnostics (before)"; diag
            echo "== MAX test message"
            curl -s -b $J -c $J -X POST "$B/notifications/max/test" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{}' \
              | jq -c '{ok, error, delivered: ([.results[]? | select(.ok)] | length), failed: ([.results[]? | select(.ok|not) | .error])}'
          fi
          echo "== test lead via public form API"
          curl -s -X POST "$B/leads" -H 'Content-Type: application/json' -d '{
            "parentName":"ТЕСТ проверка MAX","childName":"Тест Тестович","childBirthDate":"2017-07-02",
            "phone":"+79990000000","comment":"Автотест уведомлений (GitHub Actions). Можно удалить.",
            "privacyAccepted":true,"source":"test","landingPage":"/"}' | jq -c '{id, status}'
          sleep 15
          if [ "$LOGGED" = 1 ]; then echo "== MAX diagnostics (after lead)"; diag; fi

      - name: MAX diagnostics from DB (no personal data)
        if: env.MODE == 'maxdiag'
        run: |
          ssh prod "REPO_PATH='$REPO_PATH' PM2_USER='$PM2_USER' bash -s" <<'EOS'
          set +e
          cd "$REPO_PATH/apps/api"
          DBURL=$(grep -E '^DATABASE_URL=' .env | head -1 | cut -d= -f2- | tr -d '"' | sed 's/?schema=.*//')
          q() { psql "$DBURL" -At -F ' | ' -c "$1"; }
          echo "== integrations (флаги)"
          q "select key, enabled,
                    (config->>'botAccessToken') is not null and config->>'botAccessToken' <> '' as has_token,
                    config->>'publicAppUrl' as public_url,
                    coalesce(config->>'lastWebhookError','-') as last_webhook_error,
                    coalesce(config->>'lastSendAt','-') as last_send_at,
                    coalesce(config->>'lastSendOk','-') as last_send_ok,
                    coalesce(config->>'lastSendError','-') as last_send_error
             from integrations order by key"
          echo "== MAX subscribers by status"; q "select status, count(*) from max_notify_subscribers group by status"
          echo "== telegram subscribers by status"; q "select status, count(*) from telegram_notify_subscribers group by status" 2>/dev/null
          echo "== notifications (last 10)"; q "select channel, status, to_char(\"createdAt\",'YYYY-MM-DD HH24:MI') from notifications order by \"createdAt\" desc limit 10"
          echo "== leads (last 5, без ФИО/телефонов)"; q "select to_char(\"createdAt\",'YYYY-MM-DD HH24:MI'), source, status from leads order by \"createdAt\" desc limit 5"
          echo "== env flags"; for k in REDIS_URL MAX_BOT_ACCESS_TOKEN ADMIN_PUBLIC_BASE_URL CORS_ORIGIN; do v=$(grep -E "^$k=" .env | cut -d= -f2-); [ -n "$v" ] && echo "$k=set" || echo "$k=empty"; done
          echo "== redis"; redis-cli ping 2>&1 | head -1
          echo "== fam-api log (notify-строки, цифры скрыты)"
          LOG=$(sudo -u "$PM2_USER" -H pm2 jlist 2>/dev/null | jq -r '.[] | select(.name=="fam-api") | .pm2_env.pm_out_log_path')
          ELOG=$(sudo -u "$PM2_USER" -H pm2 jlist 2>/dev/null | jq -r '.[] | select(.name=="fam-api") | .pm2_env.pm_err_log_path')
          tail -n 4000 "$LOG" "$ELOG" 2>/dev/null | grep -iE "MAX|notif|BullMQ|Redis|Уведомлен|webhook|канал" | grep -viE "parent=|phone=" | sed -E 's/[0-9]{5,}/<num>/g' | tail -40
          EOS

      - name: Media — fetch & optimize
        if: env.MODE == 'media'
        run: |
          set -e
          ssh prod 'ls -la /root/fam-incoming 2>/dev/null; find /root/fam-incoming -type f | head -100' || true
          mkdir -p /tmp/in /tmp/out
          scp -r -q prod:/root/fam-incoming/. /tmp/in/ || { echo "::error::Папка /root/fam-incoming на сервере пуста или отсутствует"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick libheif1 >/dev/null 2>&1 || sudo apt-get install -y -qq ffmpeg imagemagick >/dev/null
          slug() { basename "$1" | sed 's/\.[^.]*$//' | iconv -f utf8 -t ascii//TRANSLIT 2>/dev/null | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//'; }
          n=0
          find /tmp/in -type f | sort | while read -r f; do
            n=$((n+1)); base=$(slug "$f"); [ -n "$base" ] || base="file-$n"
            ext=$(echo "${f##*.}" | tr 'A-Z' 'a-z')
            case "$ext" in
              mp4|mov|m4v|webm|mkv|avi)
                echo "== video: $(basename "$f") ($(du -h "$f" | cut -f1)) → $base"
                ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of compact "$f" | head -3
                # hero — короткий луп (20 c); клип вратарей (в имени vrat/goal/klip/clip) — целиком.
                case "$base" in *vrat*|*goal*|*klip*|*clip*) D=100000;; *) D="${MAX_SECONDS:-20}";; esac
                ffmpeg -nostdin -loglevel error -y -i "$f" -t "$D" -an -vf "scale=-2:'min(720,ih)':flags=lanczos,fps=30" \
                  -c:v libx264 -preset slow -crf 27 -profile:v high -pix_fmt yuv420p -movflags +faststart "/tmp/out/$base-720.mp4"
                ffmpeg -nostdin -loglevel error -y -i "$f" -t "$D" -an -vf "scale=-2:'min(480,ih)':flags=lanczos,fps=30" \
                  -c:v libx264 -preset slow -crf 29 -profile:v main -pix_fmt yuv420p -movflags +faststart "/tmp/out/$base-mobile.mp4"
                ffmpeg -nostdin -loglevel error -y -i "$f" -t "$D" -an -vf "scale=-2:'min(720,ih)':flags=lanczos,fps=30" \
                  -c:v libvpx-vp9 -b:v 0 -crf 40 -row-mt 1 -deadline good -cpu-used 3 "/tmp/out/$base-720.webm"
                ffmpeg -nostdin -loglevel error -y -ss 0.5 -i "$f" -frames:v 1 -vf "scale=-2:'min(1080,ih)'" "/tmp/out/$base-poster.jpg"
                ;;
              jpg|jpeg|png|webp|heic|heif)
                echo "== image: $(basename "$f") → $base.webp"
                convert "$f" -auto-orient -resize '1600x1600>' -strip -quality 82 "/tmp/out/$base.webp" || echo "WARN: не удалось конвертировать $f"
                ;;
              *) echo "skip: $(basename "$f")";;
            esac
          done
          ls -la /tmp/out
          # исходные имена → результат (для разметки тренеров)
          (cd /tmp/in && find . -type f | sort) > /tmp/out/SOURCES.txt
          git config user.name "server-ops"; git config user.email "server-ops@users.noreply.github.com"
          git checkout --orphan media-incoming-tmp
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p incoming && cp /tmp/out/* incoming/
          git add incoming && git commit -qm "media: сжатые файлы из /root/fam-incoming ($(date -u +%F))"
          git push -f origin HEAD:media-incoming
          echo "::notice::Готово: ветка media-incoming"

      - name: Verify site
        if: always() && env.MODE == 'deploy'
        run: |
          sleep 10
          for u in / /llms.txt /shkola-vratarej /robots.txt /sitemap.xml /api/site; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://footballacademymorev.ru$u")
            echo "$code $u"
          done
          curl -s https://footballacademymorev.ru/api/site | jq '{phone, vkLink, yandexMapUrl}'
